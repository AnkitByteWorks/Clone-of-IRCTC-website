spring:
  application:
    name: railconnect-backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/irctc_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:irctc_user}
    password: ${SPRING_DATASOURCE_PASSWORD:irctc_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/irctc_catalog}
      auto-index-creation: true
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/irctc_catalog}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: railconnect-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: RailConnectDefaultSuperSecretSigningKeyForDevelopment2026!
    expiration-seconds: 86400
  inventory:
    seat-lock-ttl-seconds: 300
    general-quota-ratio: 0.80
    tatkal-quota-ratio: 0.20
    default-general-rac-slots: 4
    default-general-waitlist-limit: 15
    default-tatkal-waitlist-limit: 10
    coach-prefix-by-class:
      "1A": "H"
      "2A": "A"
      "3A": "B"
      "SL": "S"
      "CC": "C"
      "EC": "E"
    chair-car-classes:
      - "CC"
      - "EC"
  booking:
    max-general-passengers-per-pnr: 6
    max-tatkal-passengers-per-pnr: 4
    pnr-length: 10
    cancellation-refund-ratio: 0.75
    enforce-tatkal-time-window: false
    tatkal-advance-days: 1
    tatkal-ac-open-time: "10:00"
    tatkal-non-ac-open-time: "11:00"
    non-ac-classes:
      - "SL"
      - "2S"
  notification:
    booking-events-topic: railconnect.booking.events
    consumer-group-id: railconnect-notification-group



