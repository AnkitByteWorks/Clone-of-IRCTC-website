name: RailConnect CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # Job 1: Backend Integration Tests with Testcontainers
  # ========================================================
  backend-integration-tests:
    name: Backend Integration Tests (Java 25 & Testcontainers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Spring Boot & Testcontainers Integration Tests
        run: ./mvnw clean test -B

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7

  # ========================================================
  # Job 2: Frontend Build Check
  # ========================================================
  frontend-build-check:
    name: Frontend Build & Lint Check (Vite 6 & Tailwind v4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Compile & Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ========================================================
  # Job 3: Docker Container Build Verification
  # ========================================================
  docker-build-verify:
    name: Multi-Stage Docker Packaging Verification
    needs: [backend-integration-tests, frontend-build-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t railconnect-backend:ci .

      - name: Build Frontend Docker Image
        run: docker build -t railconnect-frontend:ci ./frontend

      - name: Verify Docker Compose Config
        run: docker compose config
